[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goldenhour-rl"
version = "0.1.0"
description = "Verifiable Reinforcement Learning Post-Training Engine for Emergency Crisis Dispatch using GRPO"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Akshay Kumar"}
]
dependencies = [
    "torch>=2.0.0",
    "datasets>=2.18.0",
    "trl>=0.14.0",
    "peft>=0.10.0",
    "wandb>=0.16.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
demo = [
    "gradio>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["goldenhour_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["kaggle_eval", "kaggle_kernel", "_kaggle_test", "dist", "build", ".venv", "spaces"]


